name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Test (coverage gate)
        run: npm run test:ci
        env:
          NODE_ENV: test
          NEXTAUTH_SECRET: test-secret
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_PRO_MONTHLY_PRICE: price_test_pro_monthly
          STRIPE_PRO_ANNUAL_PRICE: price_test_pro_annual
          STRIPE_PREMIUM_MONTHLY_PRICE: price_test_premium_monthly
          STRIPE_PREMIUM_ANNUAL_PRICE: price_test_premium_annual

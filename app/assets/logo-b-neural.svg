<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 52" width="230" height="52" fill="none">
  <defs>
    <linearGradient id="bGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="bBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0F2744"/>
    </linearGradient>
  </defs>
  <!-- Icon background -->
  <rect x="1" y="4" width="44" height="44" rx="10" fill="url(#bBg)"/>
  <!-- Left layer nodes -->
  <circle cx="12" cy="16" r="3" fill="url(#bGrad)"/>
  <circle cx="12" cy="26" r="3" fill="url(#bGrad)" opacity="0.7"/>
  <circle cx="12" cy="36" r="3" fill="url(#bGrad)" opacity="0.5"/>
  <!-- Middle layer nodes -->
  <circle cx="23" cy="20" r="3.5" fill="url(#bGrad)"/>
  <circle cx="23" cy="32" r="3.5" fill="url(#bGrad)" opacity="0.8"/>
  <!-- Output node -->
  <circle cx="36" cy="26" r="5" fill="url(#bGrad)"/>
  <text x="33.5" y="30" font-family="'DM Sans',Arial,sans-serif" font-size="8" font-weight="700" fill="white">R</text>
  <!-- Connections left → middle -->
  <line x1="15" y1="16" x2="19.5" y2="20" stroke="#0EA5E9" stroke-width="1" opacity="0.4"/>
  <line x1="15" y1="26" x2="19.5" y2="20" stroke="#0EA5E9" stroke-width="1" opacity="0.4"/>
  <line x1="15" y1="36" x2="19.5" y2="32" stroke="#0EA5E9" stroke-width="1" opacity="0.4"/>
  <line x1="15" y1="16" x2="19.5" y2="32" stroke="#0EA5E9" stroke-width="0.7" opacity="0.2"/>
  <line x1="15" y1="26" x2="19.5" y2="32" stroke="#0EA5E9" stroke-width="1" opacity="0.4"/>
  <!-- Connections middle → right -->
  <line x1="26.5" y1="20" x2="31" y2="24" stroke="#0EA5E9" stroke-width="1.2" opacity="0.5"/>
  <line x1="26.5" y1="32" x2="31" y2="28" stroke="#0EA5E9" stroke-width="1.2" opacity="0.5"/>
  <!-- Wordmark -->
  <text x="54" y="33" font-family="'DM Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="-0.8" fill="#0F172A">resu<tspan fill="#0EA5E9">ify</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="cfav" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="9" fill="#0F172A"/>
  <!-- Inner frame -->
  <rect x="7" y="7" width="26" height="26" rx="4" fill="none" stroke="url(#cfav)" stroke-width="1.5"/>
  <!-- Pins left -->
  <line x1="0" y1="14" x2="7" y2="14" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="0" y1="20" x2="7" y2="20" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="0" y1="26" x2="7" y2="26" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pins right -->
  <line x1="33" y1="14" x2="40" y2="14" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="33" y1="20" x2="40" y2="20" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="33" y1="26" x2="40" y2="26" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pins top -->
  <line x1="14" y1="0" x2="14" y2="7" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="26" y1="0" x2="26" y2="7" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Pins bottom -->
  <line x1="20" y1="33" x2="20" y2="40" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- R monogram -->
  <text x="11" y="29" font-family="'DM Sans','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="800" fill="url(#cfav)">R</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" width="220" height="52" fill="none">
  <defs>
    <linearGradient id="cGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="cChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Chip background -->
  <rect x="2" y="4" width="44" height="44" rx="8" fill="url(#cChip)"/>
  <!-- Chip inner frame -->
  <rect x="9" y="11" width="30" height="30" rx="4" fill="none" stroke="url(#cGrad)" stroke-width="1.5"/>
  <!-- Pins left -->
  <line x1="2" y1="18" x2="9" y2="18" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="2" y1="26" x2="9" y2="26" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="2" y1="34" x2="9" y2="34" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pins right -->
  <line x1="39" y1="18" x2="46" y2="18" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="39" y1="26" x2="46" y2="26" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="39" y1="34" x2="46" y2="34" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pins top -->
  <line x1="18" y1="4" x2="18" y2="11" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="26" y1="4" x2="26" y2="11" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="34" y1="4" x2="34" y2="11" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Pins bottom -->
  <line x1="18" y1="41" x2="18" y2="48" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="26" y1="41" x2="26" y2="48" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- R monogram -->
  <text x="14" y="36" font-family="'DM Sans','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="url(#cGrad)">R</text>
  <!-- Wordmark -->
  <text x="56" y="34" font-family="'DM Sans','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="-0.8" fill="#0F172A">esu<tspan fill="#2563EB">ify</tspan></text>
  <!-- Green dot accent -->
  <circle cx="53" cy="20" r="3" fill="#10B981"/>
</svg>

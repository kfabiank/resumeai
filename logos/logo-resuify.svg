<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" fill="none">
  <defs>
    <linearGradient id="docGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
  </defs>

  <!-- Document icon -->
  <rect x="4" y="4" width="32" height="40" rx="4" fill="url(#docGrad)"/>
  <!-- Folded corner -->
  <path d="M28 4 L36 12 L28 12 Z" fill="#1E40AF" opacity="0.6"/>
  <path d="M28 4 L28 12 L36 12" fill="none" stroke="white" stroke-width="0.5" opacity="0.4"/>

  <!-- Document lines -->
  <rect x="10" y="17" width="16" height="2" rx="1" fill="white" opacity="0.9"/>
  <rect x="10" y="22" width="12" height="2" rx="1" fill="white" opacity="0.6"/>
  <rect x="10" y="27" width="14" height="2" rx="1" fill="white" opacity="0.6"/>

  <!-- Checkmark circle overlay -->
  <circle cx="30" cy="36" r="8" fill="white"/>
  <circle cx="30" cy="36" r="7" fill="url(#checkGrad)"/>
  <!-- Check mark -->
  <path d="M26.5 36 L29 38.5 L33.5 33.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="46" y="31" font-family="'DM Sans', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" letter-spacing="-0.5" fill="#0F172A">Resu<tspan fill="#2563EB">ify</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 208" width="920" height="208" fill="none" role="img" aria-label="Resuify logo dark">
  <defs>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B3A"/>
      <stop offset="100%" stop-color="#102A52"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="16" width="176" height="176" rx="40" fill="url(#bgGrad)"/>
  <rect x="4" y="16" width="176" height="176" rx="40" stroke="#1E3A6F" stroke-width="2"/>

  <circle cx="52" cy="64" r="11" fill="url(#nodeGrad)" filter="url(#softGlow)"/>
  <circle cx="52" cy="104" r="11" fill="url(#nodeGrad)" opacity="0.82"/>
  <circle cx="52" cy="144" r="11" fill="url(#nodeGrad)" opacity="0.62"/>

  <circle cx="96" cy="80" r="13" fill="url(#nodeGrad)"/>
  <circle cx="96" cy="128" r="13" fill="url(#nodeGrad)" opacity="0.85"/>

  <circle cx="144" cy="104" r="18" fill="url(#nodeGrad)"/>
  <text x="136" y="111.5" font-family="DM Sans, Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">R</text>

  <line x1="63" y1="64" x2="82" y2="80" stroke="#38BDF8" stroke-width="4" opacity="0.45" stroke-linecap="round"/>
  <line x1="63" y1="104" x2="82" y2="80" stroke="#38BDF8" stroke-width="4" opacity="0.45" stroke-linecap="round"/>
  <line x1="63" y1="144" x2="82" y2="128" stroke="#38BDF8" stroke-width="4" opacity="0.45" stroke-linecap="round"/>
  <line x1="63" y1="64" x2="82" y2="128" stroke="#38BDF8" stroke-width="3" opacity="0.22" stroke-linecap="round"/>
  <line x1="63" y1="104" x2="82" y2="128" stroke="#38BDF8" stroke-width="4" opacity="0.45" stroke-linecap="round"/>

  <line x1="109" y1="80" x2="128" y2="96" stroke="#38BDF8" stroke-width="4.5" opacity="0.55" stroke-linecap="round"/>
  <line x1="109" y1="128" x2="128" y2="112" stroke="#38BDF8" stroke-width="4.5" opacity="0.55" stroke-linecap="round"/>

  <text x="216" y="131" font-family="DM Sans, Inter, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-2" fill="#E2E8F0">resu</text>
  <text x="399" y="131" font-family="DM Sans, Inter, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-2" fill="#22D3EE">ify</text>
</svg>
